<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Decoder</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; min-height: 100vh; padding: 20px; padding-top: 100px; }
    .navbar { height: 60px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
    .navbar a { color: #fff; text-decoration: none; margin: 0 15px; }
    .navbar a:hover { color: #ffeb3b; }
    .container { max-width: 600px; margin: 20px auto; padding: 30px; background: rgba(255,255,255,0.1); border-radius: 15px; backdrop-filter: blur(10px); }
    #reader { width: 100%; max-width: 500px; margin: 20px auto; border: 3px solid #fff; border-radius: 10px; }
    button { padding: 12px 24px; background: #fff; color: #667eea; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px; }
    button:hover { background: #f0f0f0; }
    input[type="file"] { display: block; margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.2); color: #fff; }
    #result { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; margin: 20px 0; min-height: 60px; word-break: break-all; }
    #status { color: #ffeb3b; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div style="font-size: 20px; font-weight: bold;">QR Decoder</div>
    <div>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="profile.html">Profile</a>
      <a href="decoder.html">Decoder</a>
      <a href="Mob.html">Mobail Simu</a>
    </div>
  </nav>

  <div class="container">
    <h1>QR Code Scanner</h1>
    <div id="reader"></div>
    <button onclick="toggleCamera()" id="toggle-btn">Turn Camera Off</button>
    <div id="status">Starting camera...</div>
    
    <h2>Upload Image</h2>
    <input type="file" id="file" accept="image/*">
    <button onclick="uploadFile()">Scan Image</button>
    
    <div id="result">Scan result will appear here</div>
    <button id="copy-btn" style="display:none;" onclick="copyResult()">Copy Result</button>
  </div>

  <script>
    const html5QrCode = new Html5Qrcode('reader');
    let cameraRunning = false;
    let lastResult = '';

    function startCamera() {
      if (cameraRunning) return;
      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        () => {}
      ).then(() => {
        cameraRunning = true;
        document.getElementById('toggle-btn').innerText = 'Turn Camera Off';
        document.getElementById('status').innerText = 'Camera is running';
      }).catch(e => {
        document.getElementById('status').innerText = 'Camera error: ' + e;
      });
    }

    function stopCamera() {
      if (!cameraRunning) return;
      html5QrCode.stop().then(() => {
        cameraRunning = false;
        document.getElementById('toggle-btn').innerText = 'Turn Camera On';
        document.getElementById('status').innerText = 'Camera off';
      });
    }

    function toggleCamera() {
      cameraRunning ? stopCamera() : startCamera();
    }

    function onScanSuccess(text) {
      if (text !== lastResult) {
        lastResult = text;
        document.getElementById('result').innerText = text;
        document.getElementById('copy-btn').style.display = 'inline-block';
      }
    }

    function uploadFile() {
      const file = document.getElementById('file').files[0];
      if (!file) {
        alert('Select an image');
        return;
      }
      html5QrCode.scanFile(file).then(text => {
        lastResult = text;
        document.getElementById('result').innerText = text;
        document.getElementById('copy-btn').style.display = 'inline-block';
      }).catch(() => {
        document.getElementById('result').innerText = 'No QR code found';
      });
    }

    function copyResult() {
      navigator.clipboard.writeText(lastResult);
      alert('Copied!');
    }

    window.addEventListener('load', () => setTimeout(startCamera, 500));
  </script>
</body>
</html>
