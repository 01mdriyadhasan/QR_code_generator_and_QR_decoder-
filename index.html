<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>

  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/QR_code_generator_and_QR_decoder-/manifest.json">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/QR_code_generator_and_QR_decoder-/icon-192.png">
</head>

<body>
  <!-- ================= Navbar ================= -->
  <nav class="navbar">
    <div class="logo">QR Code Generator</div>

    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="menu" id="menu">
      <a href="index.html">Home</a>
      <a href="login.html">Login / Sign Up</a>
      <a href="profile.html">Profile</a>
      <a href="QR%20Decoder.html">QR Decoder</a>
      <a href="Mob.html">Mobile Simu</a>
      <a href="https://www.facebook.com/share/17i615KqwP/">Services</a>
      <a href="https://m.me/md.riyad.hasan.868680">Contact</a>
      <span id="user-info" style="color: #ffcc00; margin-left: 20px;"></span>
      <button id="logout-btn" style="display: none; background: #ff4444; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 5px;" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <!-- ================= Auth Section (যদি লগইন না থাকে) ================= -->
  <div id="auth-section" style="display: none; margin: 20px; padding: 20px; background: #222; border-radius: 10px; max-width: 500px; margin: 20px auto;">
    <h3>Log In or Sign Up to Save QR History</h3>
    <input id="email" type="email" placeholder="Enter email" style="width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; box-sizing: border-box;">
    <input id="password" type="password" placeholder="Enter password" style="width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; box-sizing: border-box;">
    <button onclick="signUp()" style="background: #0066ff; color: white; padding: 12px; width: 48%; margin-right: 2%; border: none; cursor: pointer; border-radius: 5px;">Sign Up</button>
    <button onclick="login()" style="background: #0066ff; color: white; padding: 12px; width: 48%; border: none; cursor: pointer; border-radius: 5px;">Log In</button>
    <p id="auth-message" style="color: #ffcc00; text-align: center; margin-top: 10px;"></p>
  </div>

  <!-- ================= Container ================= -->
  <div class="container">
    <h1>Generate QR Code</h1>
    <input type="text" id="text-input" placeholder="Enter text or URL">
    <button onclick="generateQR()">Generate QR</button>

    <div id="qr-preview"></div>
    <button id="download-btn" style="display: none; background: #28a745;" onclick="downloadQR()">Download QR</button>

    <div id="history">
      <h2>QR History</h2>
      <button onclick="clearHistory()" style="background: #dc3545;">Clear History</button>
      <div id="history-list"></div>
    </div>

    <p style="text-align: center; margin-top: 30px;">©2026 QR Generator. All rights reserved.</p>
  </div>

  <script type="text/javascript" src="index.min.js"></script>
  <script type="text/javascript" src="register-sw.js"></script>
</body>
</html>
