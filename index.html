<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="style.css?v=" + new Date().getTime()>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, black 0%, #2575fc 100%); color: #fff; min-height: 100vh; padding-top: 70px; }
    .navbar { height: 60px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
    .navbar a { color: #fff; text-decoration: none; margin: 0 15px; }
    .navbar a:hover { color: #0066ff; }
    .container { max-width: 600px; margin: 20px auto; padding: 30px; background: rgba(255,255,255,0.1); border-radius: 15px; backdrop-filter: blur(10px); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; }
    button { background: #0066ff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0052cc; }
    #qr-preview { text-align: center; margin: 20px 0; }
    #qr-preview canvas { max-width: 100%; }
    .history-item { background: rgba(255,255,255,0.2); padding: 10px; margin: 10px 0; border-radius: 5px; word-break: break-all; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div style="font-size: 20px; font-weight: bold;">QR Generator</div>
    <div>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="profile.html">Profile</a>
      <a href="decoder.html">Decoder</a>
    </div>
  </nav>

  <div class="container">
    <h1>Generate QR Code</h1>
    <input type="text" id="text-input" placeholder="Enter text or URL">
    <button onclick="generateQR()">Generate QR</button>
    
    <div id="qr-preview"></div>
    <button id="download-btn" style="display:none; background:#28a745;" onclick="downloadQR()">Download QR</button>
    
    <h2>History</h2>
    <button style="background:#dc3545;" onclick="clearHistory()">Clear History</button>
    <div id="history-list"></div>
  </div>

  <script>
    function toggleMenu() {}
    
    function generateQR() {
      const text = document.getElementById('text-input').value.trim();
      if (!text) {
        alert('Please enter text!');
        return;
      }
      
      const preview = document.getElementById('qr-preview');
      preview.innerHTML = '';
      
      new QRCode(preview, {
        text: text,
        width: 256,
        height: 256,
        colorDark: "#000",
        colorLight: "#fff"
      });
      
      setTimeout(() => {
        const canvas = preview.querySelector('canvas');
        if (canvas) {
          const dataURL = canvas.toDataURL('image/png');
          document.getElementById('download-btn').style.display = 'block';
          document.getElementById('download-btn').onclick = () => {
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'qrcode.png';
            link.click();
          };
          
          // Save to localStorage
          let history = JSON.parse(localStorage.getItem('qrHistory')) || [];
          history.unshift(text);
          localStorage.setItem('qrHistory', JSON.stringify(history.slice(0, 20)));
          loadHistory();
        }
      }, 100);
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('qrHistory')) || [];
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      
      history.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerText = item;
        list.appendChild(div);
      });
    }
    
    function clearHistory() {
      if (confirm('Clear all history?')) {
        localStorage.removeItem('qrHistory');
        loadHistory();
      }
    }
    
    window.addEventListener('load', loadHistory);
  </script>
</body>
</html>
