<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Sign Up - QR Code Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-bottom: 30px;
    }
    .form-container {
      width: 100%;
      max-width: 400px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      font-size: 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 16px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0055dd;
    }
    #message {
      margin-top: 20px;
      text-align: center;
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <h2>Create Account or Log In</h2>

  <div class="form-container">
    <input id="email" type="email" placeholder="Enter your email" required autocomplete="email"/>
    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password"/>

    <button onclick="signUp()">Sign Up</button>
    <button onclick="login()">Log In</button>

    <p id="message"></p>
  </div>

  <script>
    // Supabase configuration
    const supabaseUrl = 'https://ooihnyqssqubgshvakyg.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaWhueXFzc3F1YmdzaHZha3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5MDIwNTIsImV4cCI6MjA4NjQ3ODA1Mn0.yZ0istNTaImVOF7M4aeO_OfEBx-xQKVvywVNJLavMD0';

    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    // Sign Up function
    async function signUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const messageEl = document.getElementById('message');

      if (!email || !password) {
        messageEl.innerText = 'Please enter email and password';
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        messageEl.innerText = 'Error: ' + error.message;
      } else {
        messageEl.innerText = 'Account created! Please check your email to confirm.';
      }
    }

    // Login function
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const messageEl = document.getElementById('message');

      if (!email || !password) {
        messageEl.innerText = 'Please enter email and password';
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        messageEl.innerText = 'Login failed: ' + error.message;
      } else {
        messageEl.innerText = 'Login successful! Welcome, ' + data.user.email;
        // Optionally redirect to main page after login
        // setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }
    }

    // Check if user is already logged in when page loads
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        document.getElementById('message').innerText = 'Already logged in as: ' + session.user.email;
      }
    });
  </script>

</body>
</html>
